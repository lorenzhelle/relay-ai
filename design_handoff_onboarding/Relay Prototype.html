<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Relay — first prototype</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root { color-scheme: light; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #E9E3D5;
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes relay-caret {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
  const W = 402, H = 874;

  // Each screen wrapped in an IOSDevice for context.
  function Frame({ children }) {
    return (
      <IOSDevice width={W} height={H}>
        {children}
      </IOSDevice>
    );
  }

  function App() {
    return (
      <DesignCanvas
        title="Relay"
        subtitle="Voice-first quick capture · iOS · first prototype"
      >
        <DCSection
          id="onboarding"
          title="Onboarding"
          subtitle="From a fresh install to the first capture · pairing via Telegram bot (Claude Code Channels)"
        >
          <DCArtboard id="ob-welcome"  label="O1 · Welcome"             width={W} height={H}>
            <Frame><ScreenOnboardWelcome /></Frame>
          </DCArtboard>
          <DCArtboard id="ob-qr"       label="O2 · Bot eingeben"         width={W} height={H}>
            <Frame><ScreenOnboardPairQR /></Frame>
          </DCArtboard>
          <DCArtboard id="ob-manual"   label="O3 · Pairing-Code"     width={W} height={H}>
            <Frame><ScreenOnboardPairManual /></Frame>
          </DCArtboard>
          <DCArtboard id="ob-paired"   label="O4 · Paired"              width={W} height={H}>
            <Frame><ScreenOnboardPaired /></Frame>
          </DCArtboard>
          <DCArtboard id="ob-trigger"  label="O5 · Pick a trigger"      width={W} height={H}>
            <Frame><ScreenOnboardTrigger /></Frame>
          </DCArtboard>
          <DCArtboard id="ob-firstrun" label="O6 · First capture (landing)" width={W} height={H}>
            <Frame><ScreenFirstRun /></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="capture-flow"
          title="Quick capture flow"
          subtitle="The whole loop: press → speak → land → (silent) or speak back"
        >
          <DCArtboard id="home"      label="A · Home"           width={W} height={H}>
            <Frame><ScreenHome /></Frame>
          </DCArtboard>
          <DCArtboard id="listening" label="B · Listening"      width={W} height={H}>
            <Frame><ScreenListening /></Frame>
          </DCArtboard>
          <DCArtboard id="recording" label="C · Recording"      width={W} height={H}>
            <Frame><ScreenRecording /></Frame>
          </DCArtboard>
          <DCArtboard id="ack"       label="D · Captured"       width={W} height={H}>
            <Frame><ScreenAck /></Frame>
          </DCArtboard>
          <DCArtboard id="speak"     label="E · Claude speaks"  width={W} height={H}>
            <Frame><ScreenSpeak /></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="commands"
          title="Commands"
          subtitle="Zwei eingebaute Worte: send schickt los, vergessen verwirft. Aliase sind editierbar."
        >
          <DCArtboard id="rec-command" label="I · Recording, ‘send’ matched" width={W} height={H}>
            <Frame><ScreenRecordingCommand /></Frame>
          </DCArtboard>
          <DCArtboard id="cmd-library" label="J · Commands · send & vergessen" width={W} height={H}>
            <Frame><ScreenCommands /></Frame>
          </DCArtboard>
          <DCArtboard id="cmd-edit"    label="K · Edit ‘vergessen’ aliases"   width={W} height={H}>
            <Frame><ScreenCommandEdit /></Frame>
          </DCArtboard>
        </DCSection>

        <DCSection
          id="edges"
          title="Edges & system"
          subtitle="Settings, the diagnostic pane the maker actually wants"
        >
          <DCArtboard id="settings"  label="L · Settings"     width={W} height={H}>
            <Frame><ScreenSettings /></Frame>
          </DCArtboard>
          <DCArtboard id="connection" label="M · Connection"  width={W} height={H}>
            <Frame><ScreenConnection /></Frame>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
